<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BookScan Shutter - 모바일 책 스캐너</title>
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Mobile Shutter Specific Styling */
    body {
      background: #090d16;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .mobile-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
    }

    .mobile-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Viewfinder container */
    .viewfinder-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #camera-video-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Book Page Guideline Overlay */
    .book-guide-overlay {
      position: absolute;
      top: 5%;
      left: 6%;
      right: 6%;
      bottom: 5%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .guide-center-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: rgba(255, 255, 255, 0.25);
    }

    .guide-label {
      background: rgba(15, 23, 42, 0.75);
      color: #94a3b8;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Page Counter Bar */
    .page-stepper-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border-color);
      z-index: 20;
    }

    .step-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .step-btn:active {
      background: var(--accent-primary);
      transform: scale(0.92);
    }

    .current-page-badge {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }

    /* Bottom Control Deck */
    .mobile-controls-deck {
      padding: 16px 20px 24px;
      background: #090d16;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 12px;
      z-index: 20;
    }

    /* Giant Shutter Button */
    .shutter-btn-container {
      position: relative;
    }

    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .shutter-btn:active {
      transform: scale(0.88);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
    }

    .shutter-btn.interval-active {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
      animation: pulseGlow 1.2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Mode selector pill */
    .mode-switch-wrapper {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-full);
      padding: 3px;
      border: 1px solid var(--border-color);
    }

    .mode-tab {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      border-radius: var(--radius-full);
      color: var(--text-secondary);
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .mode-tab.active {
      background: var(--accent-primary);
      color: #fff;
    }

    /* Floating Lens Switcher Bar */
    .lens-bar {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 4px 10px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      z-index: 25;
    }

    .lens-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .lens-btn:active {
      transform: scale(0.9);
    }

    .lens-btn.active {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      transform: scale(1.1);
    }

    .lens-cycle-btn {
      padding: 0 10px;
      height: 38px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .res-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34d399;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      z-index: 25;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Countdown overlay */
    .countdown-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      font-weight: 800;
      color: #38bdf8;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .countdown-overlay.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Mobile Header -->
  <header class="mobile-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 20px;">📖</span>
      <span style="font-size: 15px; font-weight: 700; color: #fff;" id="mobile-book-title">스캐너 셔터</span>
      <span id="remote-status-badge" style="display: none; font-size: 10px; color: #34d399; background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.4); padding: 2px 7px; border-radius: 12px; font-weight: 600;">PC 연동됨</span>
    </div>

    <!-- Mode Selector: High-Res Native Camera vs Live Viewfinder -->
    <div class="mode-switch-wrapper">
      <button class="mode-tab active" id="tab-mode-native" title="스마트폰 기본 최고화질 카메라 앱 사용">고화질(권장)</button>
      <button class="mode-tab" id="tab-mode-live" title="실시간 브라우저 뷰파인더">실시간</button>
    </div>
  </header>

  <!-- Insecure Context (HTTP) Security Alert Banner -->
  <div id="banner-insecure-http" style="display: none; background: rgba(245, 158, 11, 0.15); border-bottom: 1px solid rgba(245, 158, 11, 0.4); padding: 10px 14px; font-size: 12px; color: #fde68a; z-index: 30;">
    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <span style="font-size: 16px;">⚠️</span>
      <div style="flex: 1;">
        <strong>HTTP 보안 제한 안내:</strong><br>
        브라우저 정책상 HTTP에서는 실시간 카메라가 차단됩니다.<br>
        <div style="margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap;">
          <button id="btn-redirect-https" class="btn btn-primary btn-sm" style="font-size: 11px; padding: 4px 10px;">
            🔒 HTTPS로 접속 (카메라 허용)
          </button>
        </div>
        <div style="margin-top: 4px; font-size: 11px; opacity: 0.85;">
          ※ USB 연결 시에는 주소창에 <code>http://localhost:8000/mobile</code> 로 접속하면 바로 허용됩니다.
        </div>
      </div>
    </div>
  </div>

  <!-- Main Viewfinder Area -->
  <main class="mobile-body">
    <div class="viewfinder-wrapper" id="viewfinder-container">
      <video id="camera-video-feed" playsinline autoplay muted style="display: none;"></video>
      <canvas id="snapshot-canvas" style="display: none;"></canvas>

      <!-- 50MP Resolution Indicator Badge -->
      <div class="res-badge" id="badge-resolution" title="현재 촬영 해상도">50MP 최고화질</div>

      <!-- Book alignment guideline -->
      <div class="book-guide-overlay" id="book-guide-overlay">
        <div class="guide-center-line"></div>
        <div class="guide-label" id="guide-label-text">책 페이지를 가이드라인에 맞추세요</div>
      </div>

      <!-- Floating Lens & Zoom Switcher Bar (1.0x 기본 활성화) -->
      <div class="lens-bar" id="lens-control-bar" style="display: none;">
        <button class="lens-btn" id="btn-lens-06" data-zoom="0.6" title="0.6배 초광각">0.6x</button>
        <button class="lens-btn active" id="btn-lens-10" data-zoom="1.0" title="1.0배 메인 렌즈 (기본)">1.0x</button>
        <button class="lens-btn" id="btn-lens-20" data-zoom="2.0" title="2.0배 줌">2.0x</button>
        <button class="lens-cycle-btn" id="btn-cycle-cameras" title="후면 카메라 렌즈 전환">
          <span>🔄</span><span id="label-cam-name">렌즈 변경</span>
        </button>
      </div>

      <!-- Hands-free interval countdown overlay -->
      <div class="countdown-overlay" id="interval-countdown">3</div>
    </div>

    <!-- Page Number Stepper -->
    <div class="page-stepper-bar">
      <button class="step-btn" id="btn-page-minus" title="페이지 번호 1 감소">−</button>
      <div class="current-page-badge">
        <span>Page </span><span id="label-current-page">1</span>
      </div>
      <button class="step-btn" id="btn-page-plus" title="페이지 번호 1 증가">+</button>
    </div>

    <!-- Hidden Native Camera Input -->
    <input type="file" id="input-native-camera" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="input-batch-gallery" multiple accept="image/*" style="display: none;">

    <!-- Bottom Shutter Control Deck -->
    <div class="mobile-controls-deck" style="justify-content: space-between; padding: 16px 28px 28px;">
      <!-- Batch Upload from Album (Left) -->
      <button class="btn btn-glass" id="btn-open-gallery" style="font-size: 12px; padding: 12px 16px; border-radius: var(--radius-full);">
        📂 갤러리
      </button>

      <!-- Giant Shutter Button (Center) -->
      <div class="shutter-btn-container">
        <button class="shutter-btn" id="btn-mobile-shutter" title="사진 찍기 / 업로드">
          <span id="shutter-icon">📸</span>
        </button>
      </div>

      <!-- Auto Interval Shutter Toggle (Right) -->
      <button class="btn btn-glass" id="btn-toggle-interval" style="font-size: 12px; padding: 12px 16px; border-radius: var(--radius-full);">
        ⏱️ 자동(4초)
      </button>
    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" style="bottom: 95px; right: 16px; left: 16px;"></div>

  <!-- Mobile Logic -->
  <script src="/static/mobile.js"></script>
</body>
</html>
